# Three-platform Tauri desktop build.
#
# Triggers on `v*` tags (release) and on manual dispatch. Each platform leg
# builds the PyInstaller gateway binary (Plan A product) and then the Tauri
# shell (Plan B) into a platform installer: .msi (Windows), .dmg (macOS),
# .AppImage / .deb (Linux).
#
# Ruling notes (see task-5-brief.md + task-5-report.md):
# - Ruling 1: we do NOT run `pnpm build` directly. `pnpm build` runs
#   `check:bundle`, which is currently over budget (initial raw ~600 KiB vs the
#   410 KiB budget) and would fail CI. Instead we invoke the platform backend
#   build script (build_desktop.*), which already runs `pnpm build` and
#   tolerates only the bundle-budget failure (see those scripts). It produces
#   the gateway binary AND a fresh web/dist that the Tauri build uses.
# - Ruling 2: the platform script is selected by runner OS — the Windows-only
#   .ps1 runs only on Windows, the POSIX .sh runs on the Linux/macOS runners.
# - Ruling 3: the gateway binary is bundled as a Tauri sidecar via
#   `bundle.externalBin`. tauri-build's copy_binaries() strips the
#   `-{target_triple}` suffix from the source and copies the result next to the
#   app executable, exactly where gateway.rs::resolve_binary() looks for
#   `codex-pro-desktop-gateway.exe`. The source file must exist with the
#   host's target-triple suffix before `tauri build`, or tauri-build fails at
#   compile time with ResourcePathNotFound — hence the "Stage gateway sidecar"
#   step below.
# - Ruling 5: bundle.targets has the four host formats; each runner builds only
#   the ones its host supports.

name: Desktop Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "10.34.5"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Build gateway backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install -e ".[all]"
          pip install pyinstaller
          pwsh packaging/desktop/build_desktop.ps1

      - name: Build gateway backend (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          pip install -e ".[all]"
          pip install pyinstaller
          bash packaging/desktop/build_desktop.sh

      # The gateway binary must exist as a target-triple-named sidecar source
      # BEFORE `tauri build`, because bundle.externalBin makes tauri-build copy
      # `binaries/codex-pro-desktop-gateway-{triple}{.exe}` to the bundle root.
      # We build it to an explicit distpath, then rename it to the host triple.
      - name: Stage gateway sidecar
        shell: bash
        run: |
          set -e
          # Host target triple, e.g. x86_64-pc-windows-msvc / x86_64-unknown-linux-gnu
          TRIPLE="$(rustc -vV | grep host | awk '{print $2}')"
          EXT=""
          if [ "${RUNNER_OS:-}" = "Windows" ]; then EXT=".exe"; fi
          mkdir -p src-tauri/binaries
          cp "dist/codex-pro-desktop-gateway${EXT}" \
             "src-tauri/binaries/codex-pro-desktop-gateway-${TRIPLE}${EXT}"
          echo "staged sidecar: src-tauri/binaries/codex-pro-desktop-gateway-${TRIPLE}${EXT}"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri bundle
        shell: bash
        run: |
          cd src-tauri
          # `tauri build` reads bundle.targets from tauri.conf.json and builds
          # only the host-supported formats (msi on Windows, dmg on macOS,
          # appimage+deb on Linux). web/dist is already built by
          # build_desktop.*, so no beforeBuildCommand is needed here.
          tauri build

      - name: List bundle output
        shell: bash
        run: ls -R src-tauri/target/release/bundle/ || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-pro-desktop-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*
            dist/codex-pro-desktop-gateway*
          if-no-files-found: error
          retention-days: 7
